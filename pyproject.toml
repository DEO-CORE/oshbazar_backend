[project]
name = "oshbazar-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django==5.2",
    "django-jazzmin==3.0.5",
    "djangorestframework==3.16.1",
    "djangorestframework-simplejwt==5.5.1",
    "django-filter==25.1",
    "drf-spectacular==0.29.0",
    "django-cors-headers==4.7.0",
    "Pillow==12.3.0",
    "django-storages==1.14.6",
    "boto3==1.43.114",
    "segno==1.6.6",
    "python-dotenv==1.2.4",
    "psycopg[binary]==3.3.6",
    "gunicorn==26.2.0",
    "whitenoise==6.8.2",
    "vercel==0.12.1"
]

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "python manage.py migrate --noinput"
